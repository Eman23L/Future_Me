name: Night Shift Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Scheduler Checks
        run: npm run test:scheduler

      - name: Write Report
        run: |
          mkdir -p night-shift-artifact
          {
            echo "# Night Shift Check"
            echo
            echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Build: passed"
            echo "Scheduler checks: passed"
            echo
            echo "This workflow does not commit code automatically."
          } > night-shift-artifact/latest-report.md

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: night-shift-report
          path: night-shift-artifact/latest-report.md
